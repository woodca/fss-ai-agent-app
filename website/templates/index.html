<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vera</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-container">
            <div class="hero-content">
                <h1 class="hero-title">Vera</h1>
                <p class="hero-subtitle">All knowing sentient agent, here to simplify existence itself</p>
                
                <!-- Main Action Buttons -->
                <div class="action-section">
                    <button class="start-button" id="sectionLeadsButton">
                        <i class="fas fa-users-crown"></i>
                        <span>Section Leads</span>
                    </button>
                    <button class="start-button secondary" id="startButton">
                        <i class="fas fa-calendar"></i>
                        <span>Calendar</span>
                    </button>
                </div>
                
            </div>
        </div>
    </section>

    <!-- Appointments Section (Initially Hidden) -->
    <section class="appointments-section" id="appointmentsSection" style="display: none;">
        <div class="appointments-container">
            <div class="section-header">
                <h2>Active Appointments</h2>
                <button class="refresh-button" id="refreshButton">
                    <i class="fas fa-sync-alt"></i>
                    Refresh
                </button>
            </div>
            
            <div class="appointments-grid" id="appointmentsGrid">
                <!-- Appointments will be loaded here -->
            </div>
        </div>
    </section>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <p>Loading appointment data...</p>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
